services:
  # ── Test suite ──────────────────────────────────────
  test:
    build: .
    image: bugdork:dev
    volumes:
      - .:/app
    working_dir: /app
    command: pytest -v

  # ── Lint ────────────────────────────────────────────
  lint:
    build: .
    image: bugdork:dev
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "ruff check dorker tests && black --check dorker tests"
    profiles: ["lint"]

  # ── CLI (guna config dari host) ─────────────────────
  cli:
    build: .
    image: bugdork:dev
    volumes:
      - .:/app
      - ${HOME}/.config/bugdork:/home/bugdork/.config/bugdork:ro
    working_dir: /app
    entrypoint: ["bugdork"]
    profiles: ["cli"]

  # ── Shell interaktif ────────────────────────────────
  shell:
    build: .
    image: bugdork:dev
    volumes:
      - .:/app
      - ${HOME}/.config/bugdork:/home/bugdork/.config/bugdork:ro
    working_dir: /app
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
    profiles: ["shell"]
