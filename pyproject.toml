[build-system]
requires = ["setuptools>=74", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BugDork"
dynamic = ["version"]
description = "BugDork Omni-Recon — Google CSE dorking and authorized OSINT URL discovery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Paku"}]
dependencies = [
    "httpx>=0.27,<0.29",
    "PyYAML>=6.0,<7",
    "colorama>=0.4.4,<0.5",
    "art>=6.3,<7",
    "appdirs>=1.4.4,<2",
    "aiofiles>=24.1,<25",
    "alive-progress>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "black>=24", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/pakulab/BugDork"
Repository = "https://github.com/pakulab/BugDork"
Issues = "https://github.com/pakulab/BugDork/issues"

[project.scripts]
bugdork = "dorker.__main__:main"
dorker = "dorker.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "dorker.__version__"}

[tool.setuptools.packages.find]
include = ["dorker*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "PERF", "FA", "BLE"]
ignore = [
    "FA100",  # Optional[] is fine — we don't need future annotations everywhere
    "FA102",  # same
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]  # tests can catch broad exceptions
